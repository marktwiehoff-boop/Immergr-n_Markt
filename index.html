<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b4332">
<title>Deine immergrün Reise</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gd:#1b4332;--g:#2d6a4f;--gm:#40916c;--gl:#52b788;--gp:#e8f5e9;--gb:#f0faf4;--am:#b5451b;--al:#fdf0eb}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;font-family:'DM Sans',system-ui,sans-serif}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
.app{position:relative;width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.progress{padding:max(env(safe-area-inset-top,0px),12px) 16px 4px;background:rgba(0,0,0,.15)}
.pbars{display:flex;gap:3px;margin-bottom:6px}
.pb{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.pbf{height:100%;border-radius:2px;background:#fff;transition:width .3s}
.pinfo{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.5);padding-bottom:2px}
.sc{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;transition:opacity .22s,transform .22s}
.sc.t{opacity:0;transform:translateX(-20px)}
.cn{display:flex;justify-content:center;gap:4px;padding:10px 8px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(0,0,0,.12)}
.cn button{background:0;border:0;color:rgba(255,255,255,.45);font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;gap:4px}
.cn button.a{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.sl{min-height:100%;display:flex;flex-direction:column}
.sl-h{align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.hl{width:80px;height:80px;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:fl 3s ease-in-out infinite;margin-bottom:20px}
.he{font-size:60px;margin-bottom:20px;animation:fl 3s ease-in-out infinite}
.ht{font-family:'DM Serif Display',Georgia,serif;font-size:38px;color:#fff;line-height:1.15;margin-bottom:14px;white-space:pre-line}
.hs{font-size:17px;color:rgba(255,255,255,.75);max-width:340px;line-height:1.5}
.hb{font-size:14px;color:rgba(255,255,255,.55);max-width:360px;margin-top:20px;line-height:1.65;white-space:pre-line}
.sl-v{position:relative;background:#000;justify-content:center;align-items:center}
.sl-v video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.vo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35);transition:opacity .3s}
.vo.hd{opacity:0;pointer-events:none}
.pb2{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:16px;transition:transform .2s}
.pb2:active{transform:scale(.92)}
.pb2 svg{margin-left:4px}
.vc{color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.pa{position:absolute;bottom:20px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.sl-i{position:relative;background:#000;align-items:center;justify-content:center}
.si{width:70%;max-width:280px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));animation:fl 3s ease-in-out infinite}
.sib{position:absolute;bottom:0;left:0;right:0;padding:60px 24px 40px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.sic{font-family:'DM Serif Display',Georgia,serif;font-size:24px;color:#fff;margin-bottom:6px}
.sis{font-size:13px;color:rgba(255,255,255,.55)}
.sl-q{align-items:center;justify-content:center;padding:48px 28px}
.qm{font-size:50px;opacity:.25;color:#fff;margin-bottom:16px}
.qt{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:#fff;text-align:center;line-height:1.55;max-width:440px}
.qa{margin-top:20px;font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:1px}
.sl-c{padding:28px 20px;background:var(--gb)}
.sl-c h2{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:#1a1a1a;margin-bottom:16px}
.mi{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:10px;border:1px solid #dde6e0;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:sil .4s ease-out both}
.mi>span:first-child{font-size:20px}.mi>span:last-child{font-size:14px;color:#444;font-weight:500}
.mf{font-size:12px;color:#999;text-align:center;font-style:italic;margin-top:12px}
.tl{position:relative;padding-left:24px}
.tll{position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--g),var(--gl))}
.ti{position:relative;margin-bottom:18px;animation:sil .4s ease-out both}
.td{position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--g);background:#fff}
.td.hl2{background:var(--g)}
.tc{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid #dde6e0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tc.hl2{border:1.5px solid var(--g)}
.ty{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--g);padding:2px 8px;border-radius:10px;margin-right:6px}
.tp{font-size:11px;color:#999}.tt{font-size:13px;color:#444;line-height:1.55;margin-top:6px}
.sl-in{align-items:center;justify-content:center;padding:40px 24px;background:var(--gb)}
.ini{font-size:48px;margin-bottom:14px}
.int{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:#1a1a1a;margin-bottom:14px;text-align:center}
.inc{background:#fff;border-radius:16px;padding:22px;border:1px solid #dde6e0;max-width:400px;font-size:14px;color:#444;line-height:1.65;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vc2{background:#fff;border-radius:12px;padding:14px;border:1px solid #b7dfcb;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fiu .35s ease-out both}
.vi{font-size:24px;margin-bottom:6px}.vn{font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:4px}.vd{font-size:11px;color:#666;line-height:1.45}
.ids{margin-bottom:20px}
.idl{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.idl.y{color:#fff}.idl.n{color:#fff}
.id-cards{display:flex;flex-direction:column;gap:8px}
.idc{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;animation:sil .35s ease-out both}
.idc.y{background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.15)}
.idc.n{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.08);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.idc-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.id-divider{height:1px;background:rgba(255,255,255,.1);margin:8px 0}
.pc{background:#fff;border-radius:12px;padding:16px;border:1px solid #dde6e0;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:sil .4s ease-out both}
.pc.hl2{border:1.5px solid var(--g)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pci{font-size:24px}.pcn{font-size:14px;font-weight:700;color:#1a1a1a}
.pcb{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--gp);color:var(--gd);font-weight:500}
.pcd{font-size:12px;color:#666;line-height:1.5}
.rc{background:#fff;border-radius:12px;border:1px solid #dde6e0;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fiu .35s ease-out both}
.rh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border:0;background:0;width:100%;text-align:left;font-family:inherit}
.ri{font-size:24px}.rt{font-size:14px;font-weight:700;color:#1a1a1a}.rd{font-size:12px;color:#666;margin-top:2px}
.ra{color:#ccc;font-size:16px;margin-left:auto}
.re{padding:0 16px 14px;border-top:1px solid #f0f0f0;padding-top:10px}
.rex{display:flex;align-items:start;gap:8px;font-size:12px;color:#555;margin-bottom:6px}
.rdot{color:var(--gm);margin-top:2px}
.nc{background:#fff;border-radius:12px;padding:16px;border:1px solid #dde6e0;border-left:3px solid var(--g);margin-bottom:10px;animation:fiu .35s ease-out both}
.nnt{font-size:14px;font-weight:700;color:var(--gd);margin-bottom:4px}
.nnx{font-size:12px;color:#555;line-height:1.55}
.nns{font-size:12px;color:#999;margin-bottom:14px}
.cls{margin-bottom:16px}.clst{font-size:14px;font-weight:700;color:#333;margin-bottom:8px}
.cli{display:flex;align-items:start;gap:10px;background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:6px;border:1px solid #dde6e0;box-shadow:0 1px 2px rgba(0,0,0,.03);animation:sil .3s ease-out both}
.clc{color:var(--gm);font-size:14px;margin-top:1px}.clt{font-size:12px;color:#444}
.dfw{position:relative;padding-left:28px}
.dfl{position:absolute;left:12px;top:12px;bottom:12px;width:2px;background:linear-gradient(to bottom,var(--g),#95d5b2)}
.dfs{position:relative;margin-bottom:18px;animation:fiu .35s ease-out both}
.dfn{position:absolute;left:-16px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dfc{background:#fff;border-radius:12px;padding:12px 16px;border:1px solid #dde6e0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.dfh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.dfi{font-size:18px}.dft{font-size:11px;font-weight:700;color:var(--gd);text-transform:uppercase;letter-spacing:.5px}
.dfx{font-size:13px;color:#444}
.sl-cl{align-items:center;justify-content:center;text-align:center;padding:48px 28px}
.clt2{font-family:'DM Serif Display',Georgia,serif;font-size:30px;color:#fff;margin-bottom:16px}
.clb{font-size:14px;color:rgba(255,255,255,.75);max-width:340px;line-height:1.65;white-space:pre-line}
.hint{position:absolute;bottom:60px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.hp{font-size:11px;color:rgba(255,255,255,.35);padding:5px 14px;border-radius:20px;background:rgba(0,0,0,.2)}
@keyframes sil{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
@keyframes fiu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>

{t:"tl",title:"Wie alles begann",ev:[
{y:"2005",p:"Berlin, Marzahn",tx:"Drei Gründer, null Gastro-Erfahrung, aber eine Vision aus dem Auslandsstudium in Australien: frische Smoothies und Säfte, live vor dem Gast zubereitet. In Deutschland kannte das damals niemand.",hl:1},
{y:"2006",p:"Hamburg",tx:"Zweite Filiale in der Passage. Das Konzept funktioniert \u2014 die Idee trägt über Berlin hinaus."},
{y:"2007",p:"Hannover",tx:"Startschuss für das Franchise-System. Der erste Franchise-Partner Christian ist heute Prokurist \u2014 echte Partnerschaft von Anfang an."},
{y:"Heute",p:"Bundesweit",tx:"Standorte in Shoppingcentern, Innenstädten und bald auch an Bahnhöfen. Eine Marke, viele Formate \u2014 und du bist jetzt Teil davon.",hl:1}
]},
{t:"ins",title:"Warum immergrün?",body:"Bewusst kein Produktname in der Marke. Kein Smoothie, kein Juice, kein Bowl im Namen. immergrün steht für moderne, lebensfrohe Ernährung \u2014 offen für alles, was kommt. Das gibt uns die Freiheit, uns weiterzuentwickeln, ohne unsere Identität zu verlieren.",ic:"\u{1F4A1}"}
]},

let S={ci:0,si:0,tr:0,dir:0,tx:null,vp:0};
const A=document.getElementById('app');
const ch=()=>C[S.ci];const sl=()=>ch().sl[S.si];

function R(){
const c=ch(),s=sl();A.style.background=c.gr;
let h=rProg(c);h+='<div class="sc" id="sc">'+rSl(s,c)+'</div>';h+=rNav();
if(S.ci===0&&S.si===0)h+='<div class="hint"><div class="hp">\u2190 Tippe links/rechts oder swipe \u2192</div></div>';
A.innerHTML=h;
const sc=document.getElementById('sc');
sc.addEventListener('touchstart',ts,{passive:1});
sc.addEventListener('touchend',te,{passive:1});
sc.addEventListener('click',oc);
document.querySelectorAll('.cn button').forEach((b,i)=>b.addEventListener('click',()=>nc(i)));
document.querySelectorAll('.rh').forEach(b=>b.addEventListener('click',e=>{
e.stopPropagation();const ex=b.parentElement.querySelector('.re');
if(ex){ex.style.display=ex.style.display==='none'?'block':'none';
const ar=b.querySelector('.ra');if(ar)ar.textContent=ex.style.display==='none'?'\u25BC':'\u25B2';}
}));bv();}

function rProg(c){
const tot=C.reduce((s,x)=>s+x.sl.length,0);let bf=0;for(let i=0;i<S.ci;i++)bf+=C[i].sl.length;
const pct=Math.round(((bf+S.si+1)/tot)*100);
let b='';c.sl.forEach((_,i)=>{const w=i<S.si?'100%':i===S.si?'50%':'0%';b+='<div class="pb"><div class="pbf" style="width:'+w+'"></div></div>';});
return '<div class="progress"><div class="pbars">'+b+'</div><div class="pinfo"><span>'+c.ic+' '+c.lb+'</span><span>'+pct+'%</span></div></div>';}

function rNav(){let h='<div class="cn">';C.forEach((c,i)=>{const a=i===S.ci?' a':'';const l=i===S.ci?'<span>'+c.lb+'</span>':'';h+='<button class="'+a+'"><span>'+c.ic+'</span>'+l+'</button>';});return h+'</div>';}

function rSl(s,c){
if(s.t==='hero'){const v=s.logo?'<img src="'+LOGO+'" class="hl">':'<div class="he">'+s.em+'</div>';const b=s.body?'<p class="hb">'+s.body+'</p>':'';return '<div class="sl sl-h" style="background:'+c.gr+'">'+v+'<h1 class="ht">'+s.title+'</h1><p class="hs">'+s.sub+'</p>'+b+'</div>';}
if(s.t==='video')return '<div class="sl sl-v" id="vs"><video id="vel" playsinline preload="none"></video><div class="vo" id="vov"><button class="pb2" id="vpb"><svg width="28" height="32" viewBox="0 0 28 32" fill="none"><path d="M4 2L26 16L4 30V2Z" fill="white"/></svg></button><p class="vc">'+s.cap+'</p></div><button class="pa" id="vpa" style="display:none"><svg width="14" height="16" viewBox="0 0 14 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1" fill="white"/><rect x="9" y="1" width="4" height="14" rx="1" fill="white"/></svg></button></div>';
if(s.t==='img')return '<div class="sl sl-i"><img src="'+SMTH+'" class="si"><div class="sib"><h2 class="sic">'+s.cap+'</h2><p class="sis">'+s.sub+'</p></div></div>';
if(s.t==='quote')return '<div class="sl sl-q" style="background:'+c.gr+'"><div class="qm">\u275D</div><blockquote class="qt">'+s.q+'</blockquote><div class="qa">\u2014 '+s.at+'</div></div>';
if(s.t==='msg'){let it='';s.items.forEach((x,i)=>{it+='<div class="mi" style="animation-delay:'+(i*.08)+'s"><span>'+x.ic+'</span><span>'+x.tx+'</span></div>';});const f=s.ft?'<p class="mf">'+s.ft+'</p>':'';return '<div class="sl sl-c"><h2>'+s.title+'</h2>'+it+f+'</div>';}
if(s.t==='tl'){let it='';s.ev.forEach((e,i)=>{const h=e.hl?' hl2':'';it+='<div class="ti" style="animation-delay:'+(i*.1)+'s"><div class="td'+h+'"></div><div class="tc'+h+'"><span class="ty">'+e.y+'</span><span class="tp">'+e.p+'</span><p class="tt">'+e.tx+'</p></div></div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2><div class="tl"><div class="tll"></div>'+it+'</div></div>';}
if(s.t==='ins')return '<div class="sl sl-in"><div class="ini">'+s.ic+'</div><h2 class="int">'+s.title+'</h2><div class="inc">'+s.body+'</div></div>';
if(s.t==='val'){let cd='';s.v.forEach((v,i)=>{cd+='<div class="vc2" style="animation-delay:'+(i*.06)+'s"><div class="vi">'+v.ic+'</div><div class="vn">'+v.n+'</div><div class="vd">'+v.d+'</div></div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2><div class="vg">'+cd+'</div></div>';}
if(s.t==='id'){var yIc=['\u{1F30D}','\u2600\uFE0F','\u{1F91E}','\u{1F353}','\u{1F4B0}','\u{1F3AF}'];var nIc=['\u{274C}','\u{274C}','\u{274C}','\u{274C}','\u{274C}'];let y='',n='';s.y.forEach(function(x,i){y+='<div class="idc y" style="animation-delay:'+(i*0.06)+'s"><span class="idc-icon">'+yIc[i]+'</span><span>'+x+'</span></div>';});s.n.forEach(function(x,i){n+='<div class="idc n" style="animation-delay:'+((i+6)*0.06)+'s"><span class="idc-icon">'+nIc[i]+'</span><span>'+x+'</span></div>';});return '<div class="sl" style="background:'+c.gr+';padding:28px 20px;display:flex;flex-direction:column;justify-content:center"><h2 style="font-family:\'DM Serif Display\',Georgia,serif;font-size:24px;color:#fff;text-align:center;margin-bottom:24px">'+s.title+'</h2><div class="ids"><div class="idl y">\u2705 Das sind wir</div><div class="id-cards">'+y+'</div></div><div class="id-divider"></div><div class="ids"><div class="idl n">\u{274C} Das sind wir nicht</div><div class="id-cards">'+n+'</div></div></div>';}
if(s.t==='prod'){let cd='';s.cats.forEach((c,i)=>{const h=c.hl?' hl2':'';const b=c.hl?'<span class="pcb">Unser Herzstück</span>':'';cd+='<div class="pc'+h+'" style="animation-delay:'+(i*.08)+'s"><div class="ph"><span class="pci">'+c.ic+'</span><span class="pcn">'+c.n+'</span>'+b+'</div><p class="pcd">'+c.d+'</p></div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2>'+cd+'</div>';}
if(s.t==='resp'){let cd='';s.items.forEach((x,i)=>{let ex='';x.ex.forEach(e=>{ex+='<div class="rex"><span class="rdot">\u25CF</span><span>'+e+'</span></div>';});cd+='<div class="rc" style="animation-delay:'+(i*.1)+'s"><div class="rh"><span class="ri">'+x.ic+'</span><div style="flex:1"><div class="rt">'+x.title+'</div><div class="rd">'+x.d+'</div></div><span class="ra">\u25BC</span></div><div class="re" style="display:none">'+ex+'</div></div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2>'+cd+'</div>';}
if(s.t==='nn'){let cd='';s.items.forEach((x,i)=>{cd+='<div class="nc" style="animation-delay:'+(i*.1)+'s"><div class="nnt">'+x.title+'</div><p class="nnx">'+x.tx+'</p></div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2><p class="nns">'+s.st+'</p>'+cd+'</div>';}
if(s.t==='cl'){let sc='';s.secs.forEach((sec,i)=>{let it='';sec.items.forEach((x,j)=>{it+='<div class="cli" style="animation-delay:'+((i*3+j)*.04)+'s"><span class="clc">\u2713</span><span class="clt">'+x+'</span></div>';});sc+='<div class="cls"><div class="clst">'+sec.title+'</div>'+it+'</div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2>'+sc+'</div>';}
if(s.t==='df'){let st='';s.steps.forEach((x,i)=>{st+='<div class="dfs" style="animation-delay:'+(i*.1)+'s"><div class="dfn">'+(i+1)+'</div><div class="dfc"><div class="dfh"><span class="dfi">'+x.ic+'</span><span class="dft">'+x.tm+'</span></div><p class="dfx">'+x.tx+'</p></div></div>';});return '<div class="sl sl-c"><h2>'+s.title+'</h2><div class="dfw"><div class="dfl"></div>'+st+'</div></div>';}
if(s.t==='end'){const v=s.logo?'<img src="'+LOGO+'" style="width:70px;height:70px;border-radius:50%;margin-bottom:24px;box-shadow:0 8px 30px rgba(0,0,0,.3)">':'';return '<div class="sl sl-cl" style="background:'+c.gr+'">'+v+'<h2 class="clt2">'+s.title+'</h2><p class="clb">'+s.body+'</p></div>';}
return '';}

function nav(d){if(S.tr)return;const c=ch(),ns=S.si+d;
if(ns>=0&&ns<c.sl.length){tr(d,()=>{S.si=ns;});}
else if(d>0&&S.ci<C.length-1){tr(d,()=>{S.ci++;S.si=0;});}
else if(d<0&&S.ci>0){tr(d,()=>{S.ci--;S.si=C[S.ci].sl.length-1;});}}

function nc(i){if(i===S.ci)return;tr(i>S.ci?1:-1,()=>{S.ci=i;S.si=0;});}

function tr(d,fn){S.tr=1;S.dir=d;const sc=document.getElementById('sc');
if(sc){sc.style.opacity='0';sc.style.transform='translateX('+(d>0?'-20px':'20px')+')';}
setTimeout(()=>{sv();fn();S.tr=0;R();},220);}

function bv(){const pb=document.getElementById('vpb'),pa=document.getElementById('vpa'),v=document.getElementById('vel'),ov=document.getElementById('vov');
if(!pb||!v)return;
pb.onclick=e=>{e.stopPropagation();if(!v.src||v.src===location.href)v.src=_gv();v.play().catch(function(){});S.vp=1;ov.classList.add('hd');pa.style.display='flex';};
pa.onclick=e=>{e.stopPropagation();v.pause();S.vp=0;ov.classList.remove('hd');pa.style.display='none';};
v.onclick=e=>{e.stopPropagation();if(S.vp){v.pause();S.vp=0;ov.classList.remove('hd');pa.style.display='none';}else{if(!v.src||v.src===location.href)v.src=_gv();v.play().catch(function(){});S.vp=1;ov.classList.add('hd');pa.style.display='flex';}};
v.onended=()=>{S.vp=0;ov.classList.remove('hd');pa.style.display='none';};}
function sv(){const v=document.getElementById('vel');if(v){v.pause();S.vp=0;}}

function ts(e){if(sl().t==='video'&&S.vp)return;S.tx=e.touches[0].clientX;}
function te(e){if(S.tx===null)return;if(sl().t==='video'&&S.vp){S.tx=null;return;}
const d=S.tx-e.changedTouches[0].clientX;if(Math.abs(d)>50)nav(d>0?1:-1);S.tx=null;}
function oc(e){if(sl().t==='video')return;const sc=document.getElementById('sc');if(!sc)return;
const r=sc.getBoundingClientRect(),x=e.clientX-r.left;
if(x<r.width*.3)nav(-1);else if(x>r.width*.7)nav(1);}

document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nav(1);}
if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}});

R();

}catch(e){
document.getElementById('app').innerHTML='<div style="color:white;padding:40px;font-family:sans-serif"><h2>Fehler beim Laden</h2><p style="margin-top:12px;color:#aaa">'+e.message+'</p><p style="margin-top:20px;font-size:13px;color:#666">Bitte öffne diese Datei in Chrome oder Safari.</p></div>';
console.error(e);
}
